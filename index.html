<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dear, Love</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #f5f0eb 0%, #e8dfd5 25%, #d7ccc8 50%, #e8dfd5 75%, #f5f0eb 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    position: relative;
    overflow-x: hidden;
  }

  .container {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    padding: 24px;
    max-width: 520px;
    width: 100%;
    position: relative;
    z-index: 1;
    backdrop-filter: blur(10px);
  }

  h1 {
    text-align: center;
    color: #4e342e;
    font-size: 1.6em;
    margin-bottom: 6px;
    text-shadow: 2px 2px 4px rgba(78, 52, 46, 0.2);
  }

  .subtitle {
    text-align: center;
    color: #5d4037;
    font-style: italic;
    margin-bottom: 18px;
    font-size: 0.95em;
  }

  .view {
    display: none;
    animation: fadeIn 0.6s ease-in;
  }

  .view.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  label {
    display: block;
    margin: 10px 0 5px 0;
    color: #4e342e;
    font-weight: bold;
    font-size: 0.9em;
  }

  input[type="text"],
  textarea {
    width: 100%;
    padding: 9px 12px;
    border: 2px solid #d7ccc8;
    border-radius: 8px;
    font-family: 'Georgia', serif;
    font-size: 0.95em;
    transition: border-color 0.3s ease;
    background: #fff;
    color: #333;
  }

  input[type="text"]:focus,
  textarea:focus {
    outline: none;
    border-color: #6d4c41;
    box-shadow: 0 0 8px rgba(109, 76, 65, 0.15);
  }

  textarea {
    resize: vertical;
    min-height: 140px;
    line-height: 1.5;
  }

  .buttons {
    display: flex;
    gap: 15px;
    margin-top: 25px;
    flex-wrap: wrap;
  }

  button {
    flex: 1;
    padding: 14px 25px;
    background: linear-gradient(135deg, #5d4037, #4e342e);
    color: white;
    border: none;
    border-radius: 25px;
    font-family: 'Georgia', serif;
    font-size: 1.1em;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(93, 64, 46, 0.3);
    min-width: 140px;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(93, 64, 46, 0.5);
    background: linear-gradient(135deg, #6d4c41, #5d4037);
  }

  button:active {
    transform: translateY(0);
  }

  button.secondary {
    background: linear-gradient(135deg, #8d6e63, #795548);
  }

  button.danger {
    background: linear-gradient(135deg, #4e342e, #3e2723);
  }

  .letter-display {
    background: #fff;
    border: 2px dashed #d7ccc8;
    border-radius: 15px;
    padding: 30px;
    margin: 20px 0;
    box-shadow: inset 0 0 20px rgba(141, 110, 99, 0.08);
  }

  .letter-display h2 {
    color: #4e342e;
    margin-bottom: 15px;
    font-size: 1.8em;
    text-align: center;
  }

  .letter-display .meta {
    text-align: center;
    color: #5d4037;
    font-style: italic;
    margin-bottom: 20px;
    font-size: 0.95em;
  }

  .letter-display .message {
    color: #333;
    line-height: 1.8;
    font-size: 1.05em;
    white-space: pre-wrap;
    text-align: justify;
  }

  .letter-display .signature {
    text-align: right;
    margin-top: 25px;
    color: #5d4037;
    font-style: italic;
    font-size: 1.1em;
  }

  .toast {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #4caf50;
    color: white;
    padding: 15px 25px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    z-index: 1000;
    animation: slideIn 0.4s ease-out, fadeOut 0.4s ease-in 2.6s;
    font-family: 'Georgia', serif;
  }

  @keyframes slideIn {
    from { transform: translateX(400px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  @keyframes fadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
  }

  .placeholder {
    text-align: center;
    color: #6d4c41;
    font-style: italic;
    padding: 40px 20px;
    font-size: 1.1em;
  }

  .placeholder .icon {
    font-size: 4em;
    margin-bottom: 15px;
  }

  .clickable-placeholder {
    text-align: center;
    color: #6d4c41;
    font-style: italic;
    padding: 40px 20px;
    font-size: 1.1em;
    cursor: pointer;
    transition: all 0.3s ease;
    user-select: none;
  }

  .clickable-placeholder:hover {
    transform: scale(1.05);
    color: #4e342e;
  }

  .clickable-placeholder .icon {
    font-size: 5em;
    margin-bottom: 15px;
    display: block;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  .divider {
    height: 2px;
    background: linear-gradient(90deg, transparent, #d7ccc8, transparent);
    margin: 25px 0;
  }

  .history-list {
    list-style: none;
    margin-top: 10px;
  }

  .history-list li {
    padding: 12px;
    margin-bottom: 8px;
    background: #f5f0eb;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .history-list li:hover {
    background: #e8dfd5;
    transform: translateX(4px);
  }

  .history-list .history-info {
    flex: 1;
  }

  .history-list .history-to {
    font-weight: bold;
    color: #4e342e;
  }

  .history-list .history-meta {
    font-size: 0.85em;
    color: #8d6e63;
  }

  .history-list .history-actions {
    display: flex;
    gap: 8px;
  }

  .history-list button {
    padding: 6px 12px;
    font-size: 0.85em;
    min-width: auto;
  }

  @media (max-width: 600px) {
    .container {
      padding: 25px 20px;
    }

    h1 {
      font-size: 2em;
    }

    button {
      min-width: 100%;
    }

    .buttons {
      flex-direction: column;
    }
  }
</style>
</head>
<body>

<div class="container">
  <h1>Dear, Love</h1>
  <p class="subtitle">Write and read your messages</p>

  <div class="view active" id="writeView">
    <form id="letterForm">
      <label for="recipient">To:</label>
      <input type="text" id="recipient" placeholder="Recipient name..." required>

      <label for="sender">From:</label>
      <input type="text" id="sender" placeholder="Sender name..." required>

      <label for="message">Message:</label>
      <textarea id="message" placeholder="Write your message here..." required></textarea>

      <div class="buttons">
        <button type="submit">Save & Get Link</button>
        <button type="button" class="secondary" id="historyBtn">History</button>
      </div>
    </form>
  </div>

  <div class="view" id="readView">
    <div class="letter-display" id="letterDisplay">
      <div class="clickable-placeholder" id="clickablePlaceholder">
        <div class="icon">✉️</div>
        <p>Click to read message</p>
      </div>
    </div>

    <div class="buttons">
      <button id="writeNewBtn">Write New Message</button>
      <button class="secondary" id="copyLinkBtn" style="display:none;">Copy Link</button>
    </div>
  </div>

  <div class="view" id="historyView">
    <h2 style="text-align: center; color: #4e342e; margin-bottom: 15px;">Message History</h2>
    <div class="divider"></div>
    <ul class="history-list" id="historyList"></ul>
    <div class="buttons">
      <button id="backToWriteBtn">Back to Write</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'dear_love_message';
  const HISTORY_KEY = 'dear_love_history';

  const writeView = document.getElementById('writeView');
  const readView = document.getElementById('readView');
  const historyView = document.getElementById('historyView');
  const letterForm = document.getElementById('letterForm');
  const letterDisplay = document.getElementById('letterDisplay');
  const recipientInput = document.getElementById('recipient');
  const senderInput = document.getElementById('sender');
  const messageInput = document.getElementById('message');
  const writeNewBtn = document.getElementById('writeNewBtn');
  const copyLinkBtn = document.getElementById('copyLinkBtn');
  const historyBtn = document.getElementById('historyBtn');
  const historyList = document.getElementById('historyList');
  const backToWriteBtn = document.getElementById('backToWriteBtn');

  let messageRevealed = false;
  let currentMessage = null;

  function showView(view) {
    writeView.classList.remove('active');
    readView.classList.remove('active');
    historyView.classList.remove('active');
    view.classList.add('active');
    messageRevealed = false;
    if (view === readView) {
      resetReadView();
    }
    if (view === historyView) {
      renderHistory();
    }
  }

  function resetReadView() {
    letterDisplay.innerHTML = `
      <div class="clickable-placeholder" id="clickablePlaceholder">
        <div class="icon">✉️</div>
        <p>Click to read message</p>
      </div>
    `;
    const newPlaceholder = document.getElementById('clickablePlaceholder');
    if (newPlaceholder) {
      newPlaceholder.addEventListener('click', revealMessage);
    }
    copyLinkBtn.style.display = 'none';
  }

  function showToast(message) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => {
      toast.remove();
    }, 3000);
  }

  function encodeMessage(letter) {
    const data = btoa(unescape(encodeURIComponent(JSON.stringify(letter))));
    return data;
  }

  function decodeMessage(encoded) {
    try {
      const json = decodeURIComponent(escape(atob(encoded)));
      return JSON.parse(json);
    } catch (e) {
      return null;
    }
  }

  function getMessageFromHash() {
    const hash = window.location.hash;
    if (!hash || !hash.startsWith('#message=')) return null;
    const encoded = hash.replace('#message=', '');
    return decodeMessage(encoded);
  }

  function setMessageInHash(letter) {
    const encoded = encodeMessage(letter);
    window.location.hash = 'message=' + encoded;
  }

  function saveToHistory(letter) {
    let history = [];
    try {
      const stored = localStorage.getItem(HISTORY_KEY);
      if (stored) history = JSON.parse(stored);
    } catch (e) {}
    history.unshift({
      ...letter,
      id: Date.now(),
      encoded: encodeMessage(letter),
      createdAt: new Date().toISOString()
    });
    if (history.length > 50) history = history.slice(0, 50);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  }

  function getHistory() {
    try {
      const stored = localStorage.getItem(HISTORY_KEY);
      return stored ? JSON.parse(stored) : [];
    } catch (e) {
      return [];
    }
  }

  function renderHistory() {
    const history = getHistory();
    historyList.innerHTML = '';
    if (history.length === 0) {
      historyList.innerHTML = '<li style="cursor:default; justify-content:center; color:#8d6e63;">No messages yet</li>';
      return;
    }
    history.forEach((item) => {
      const li = document.createElement('li');
      const date = new Date(item.createdAt);
      const formattedDate = date.toLocaleDateString('en-US', {
        day: 'numeric',
        month: 'short',
        year: 'numeric'
      });
      li.innerHTML = `
        <div class="history-info">
          <div class="history-to">To: ${escapeHtml(item.recipient)}</div>
          <div class="history-meta">From: ${escapeHtml(item.sender)} • ${formattedDate}</div>
        </div>
        <div class="history-actions">
          <button class="secondary" data-action="open" data-id="${item.id}">Open</button>
          <button class="secondary" data-action="share" data-encoded="${item.encoded}">Share</button>
        </div>
      `;
      historyList.appendChild(li);
    });

    historyList.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const action = e.target.dataset.action;
        const id = parseInt(e.target.dataset.id);
        const encoded = e.target.dataset.encoded;
        const history = getHistory();
        const item = history.find(h => h.id === id);

        if (action === 'open' && item) {
          currentMessage = item;
          setMessageInHash(item);
          renderLetter(item);
          showView(readView);
        } else if (action === 'share' && encoded) {
          const url = window.location.origin + window.location.pathname + '#message=' + encoded;
          navigator.clipboard.writeText(url).then(() => {
            showToast('Link copied! Share it with anyone.');
          }).catch(() => {
            showToast('Copy this URL: ' + url);
          });
        }
      });
    });
  }

  function revealMessage() {
    if (messageRevealed) return;
    messageRevealed = true;
    const letter = currentMessage || getMessageFromHash();
    if (!letter) {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        currentMessage = JSON.parse(stored);
      }
    }
    renderLetter(currentMessage || letter);
  }

  function renderLetter(letter) {
    if (!letter) {
      letterDisplay.innerHTML = `
        <div class="placeholder">
          <div class="icon">✉️</div>
          <p>No message written yet.</p>
        </div>
      `;
      return;
    }

    const date = new Date(letter.createdAt);
    const formattedDate = date.toLocaleDateString('en-US', {
      day: 'numeric',
      month: 'long',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });

    letterDisplay.innerHTML = `
      <h2>Message for ${escapeHtml(letter.recipient)}</h2>
      <div class="divider"></div>
      <p class="meta">📅 ${formattedDate}</p>
      <div class="divider"></div>
      <div class="message">${escapeHtml(letter.message)}</div>
      <div class="divider"></div>
      <div class="signature">Yours sincerely,<br><strong>${escapeHtml(letter.sender)}</strong></div>
    `;
    copyLinkBtn.style.display = 'flex';
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  letterForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const letter = {
      recipient: recipientInput.value.trim(),
      sender: senderInput.value.trim(),
      message: messageInput.value.trim(),
      createdAt: new Date().toISOString()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(letter));
    currentMessage = letter;
    saveToHistory(letter);
    setMessageInHash(letter);
    showToast('Message saved! Share the link below.');
    showView(readView);
  });

  writeNewBtn.addEventListener('click', () => {
    currentMessage = null;
    window.location.hash = '';
    recipientInput.value = '';
    senderInput.value = '';
    messageInput.value = '';
    showView(writeView);
  });

  copyLinkBtn.addEventListener('click', () => {
    const url = window.location.href;
    navigator.clipboard.writeText(url).then(() => {
      showToast('Link copied! Share it with anyone.');
    }).catch(() => {
      showToast('Copy this URL: ' + url);
    });
  });

  historyBtn.addEventListener('click', () => {
    showView(historyView);
  });

  backToWriteBtn.addEventListener('click', () => {
    showView(writeView);
  });

  window.addEventListener('hashchange', () => {
    const letter = getMessageFromHash();
    if (letter) {
      currentMessage = letter;
      renderLetter(letter);
      showView(readView);
    }
  });

  window.addEventListener('load', () => {
    const letter = getMessageFromHash();
    if (letter) {
      currentMessage = letter;
      renderLetter(letter);
      showView(readView);
    } else {
      showView(writeView);
    }
  });
</script>

</body>
</html>
