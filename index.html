<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dear, Love</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #f5f0eb 0%, #e8dfd5 25%, #d7ccc8 50%, #e8dfd5 75%, #f5f0eb 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    position: relative;
    overflow-x: hidden;
  }

  .container {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    padding: 24px;
    max-width: 520px;
    width: 100%;
    position: relative;
    z-index: 1;
    backdrop-filter: blur(10px);
  }

  h1 {
    text-align: center;
    color: #4e342e;
    font-size: 1.6em;
    margin-bottom: 6px;
    text-shadow: 2px 2px 4px rgba(78, 52, 46, 0.2);
  }

  .subtitle {
    text-align: center;
    color: #5d4037;
    font-style: italic;
    margin-bottom: 18px;
    font-size: 0.95em;
  }

  .view {
    display: none;
    animation: fadeIn 0.6s ease-in;
  }

  .view.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  label {
    display: block;
    margin: 10px 0 5px 0;
    color: #4e342e;
    font-weight: bold;
    font-size: 0.9em;
  }

  input[type="text"],
  textarea {
    width: 100%;
    padding: 9px 12px;
    border: 2px solid #d7ccc8;
    border-radius: 8px;
    font-family: 'Georgia', serif;
    font-size: 0.95em;
    transition: border-color 0.3s ease;
    background: #fff;
    color: #333;
  }

  input[type="text"]:focus,
  textarea:focus {
    outline: none;
    border-color: #6d4c41;
    box-shadow: 0 0 8px rgba(109, 76, 65, 0.15);
  }

  textarea {
    resize: vertical;
    min-height: 140px;
    line-height: 1.5;
  }

  .buttons {
    display: flex;
    gap: 15px;
    margin-top: 25px;
    flex-wrap: wrap;
  }

  button {
    flex: 1;
    padding: 14px 25px;
    background: linear-gradient(135deg, #5d4037, #4e342e);
    color: white;
    border: none;
    border-radius: 25px;
    font-family: 'Georgia', serif;
    font-size: 1.1em;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(93, 64, 46, 0.3);
    min-width: 140px;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(93, 64, 46, 0.5);
    background: linear-gradient(135deg, #6d4c41, #5d4037);
  }

  button:active {
    transform: translateY(0);
  }

  button.secondary {
    background: linear-gradient(135deg, #8d6e63, #795548);
  }

  button.danger {
    background: linear-gradient(135deg, #4e342e, #3e2723);
  }

  .letter-display {
    background: #fff;
    border: 2px dashed #d7ccc8;
    border-radius: 15px;
    padding: 30px;
    margin: 20px 0;
    box-shadow: inset 0 0 20px rgba(141, 110, 99, 0.08);
  }

  .letter-display h2 {
    color: #4e342e;
    margin-bottom: 15px;
    font-size: 1.8em;
    text-align: center;
  }

  .letter-display .meta {
    text-align: center;
    color: #5d4037;
    font-style: italic;
    margin-bottom: 20px;
    font-size: 0.95em;
  }

  .letter-display .message {
    color: #333;
    line-height: 1.8;
    font-size: 1.05em;
    white-space: pre-wrap;
    text-align: justify;
  }

  .letter-display .signature {
    text-align: right;
    margin-top: 25px;
    color: #5d4037;
    font-style: italic;
    font-size: 1.1em;
  }

  .toast {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #4caf50;
    color: white;
    padding: 15px 25px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    z-index: 1000;
    animation: slideIn 0.4s ease-out, fadeOut 0.4s ease-in 2.6s;
    font-family: 'Georgia', serif;
  }

  @keyframes slideIn {
    from { transform: translateX(400px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  @keyframes fadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
  }

  .placeholder {
    text-align: center;
    color: #6d4c41;
    font-style: italic;
    padding: 40px 20px;
    font-size: 1.1em;
  }

  .placeholder .icon {
    font-size: 4em;
    margin-bottom: 15px;
  }

  .divider {
    height: 2px;
    background: linear-gradient(90deg, transparent, #d7ccc8, transparent);
    margin: 25px 0;
  }

  .message-list {
    list-style: none;
    margin-top: 10px;
  }

  .message-list li {
    padding: 15px;
    margin-bottom: 10px;
    background: #f5f0eb;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .message-list li:hover {
    background: #e8dfd5;
    transform: translateX(4px);
  }

  .message-list .msg-to {
    font-weight: bold;
    color: #4e342e;
    margin-bottom: 4px;
  }

  .message-list .msg-preview {
    color: #6d4c41;
    font-size: 0.9em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .message-list .msg-meta {
    font-size: 0.8em;
    color: #8d6e63;
    margin-top: 4px;
  }

  .settings-box {
    background: #f5f0eb;
    border-radius: 10px;
    padding: 20px;
    margin-top: 15px;
  }

  .settings-box h3 {
    color: #4e342e;
    margin-bottom: 10px;
    font-size: 1.1em;
  }

  .settings-box p {
    color: #6d4c41;
    font-size: 0.9em;
    margin-bottom: 10px;
    line-height: 1.5;
  }

  .settings-box input {
    margin-bottom: 10px;
  }

  .sync-status {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 0.8em;
    margin-left: 10px;
    vertical-align: middle;
  }

  .sync-status.on {
    background: #c8e6c9;
    color: #2e7d32;
  }

  .sync-status.off {
    background: #ffcdd2;
    color: #c62828;
  }

  @media (max-width: 600px) {
    .container {
      padding: 25px 20px;
    }

    h1 {
      font-size: 2em;
    }

    button {
      min-width: 100%;
    }

    .buttons {
      flex-direction: column;
    }
  }
</style>
</head>
<body>

<div class="container">
  <h1>Dear, Love <span id="syncStatus" class="sync-status off">Local</span></h1>
  <p class="subtitle">Write and read your messages</p>

  <div class="view active" id="writeView">
    <form id="letterForm">
      <label for="recipient">To:</label>
      <input type="text" id="recipient" placeholder="Recipient name..." required>

      <label for="sender">From:</label>
      <input type="text" id="sender" placeholder="Sender name..." required>

      <label for="message">Message:</label>
      <textarea id="message" placeholder="Write your message here..." required></textarea>

      <div class="buttons">
        <button type="submit">Save Message</button>
        <button type="button" class="secondary" id="openBtn">Open with Code</button>
        <button type="button" class="secondary" id="historyBtn">History</button>
        <button type="button" class="secondary" id="settingsBtn">Settings</button>
      </div>
    </form>
  </div>

  <div class="view" id="readView">
    <div class="letter-display" id="letterDisplay"></div>

    <div class="buttons">
      <button id="writeNewBtn">Write New Message</button>
      <button class="secondary" id="copyCodeBtn" style="display:none;">Copy Code</button>
    </div>
  </div>

  <div class="view" id="historyView">
    <h2 style="text-align: center; color: #4e342e; margin-bottom: 15px;">Public Inbox</h2>
    <div class="divider"></div>
    <ul class="message-list" id="messageList"></ul>
    <div class="buttons">
      <button id="backToWriteBtn">Back to Write</button>
      <button class="secondary" id="refreshBtn">Refresh</button>
    </div>
  </div>

  <div class="view" id="settingsView">
    <h2 style="text-align: center; color: #4e342e; margin-bottom: 15px;">Settings</h2>
    <div class="divider"></div>
    <div class="settings-box">
      <h3>GitHub Sync</h3>
      <p>Connect your GitHub account to share messages publicly. Anyone can read messages from the public inbox without signing in.</p>
      <label for="githubToken">GitHub Personal Access Token:</label>
      <input type="text" id="githubToken" placeholder="ghp_xxxxxxxxxxxx">
      <p style="font-size: 0.8em; color: #8d6e63;">Required scopes: <code>public_repo</code>. <a href="https://github.com/settings/tokens/new" target="_blank">Create token</a></p>
      <button id="saveTokenBtn">Save Token</button>
      <button class="danger" id="clearTokenBtn">Clear Token</button>
    </div>
    <div class="buttons">
      <button id="backFromSettingsBtn">Back</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'dear_love_message';
  const HISTORY_KEY = 'dear_love_history';
  const TOKEN_KEY = 'dear_love_github_token';
  const REPO_OWNER = 'kaylazihan';
  const REPO_NAME = 'Dear-Love';

  const writeView = document.getElementById('writeView');
  const readView = document.getElementById('readView');
  const historyView = document.getElementById('historyView');
  const settingsView = document.getElementById('settingsView');
  const letterForm = document.getElementById('letterForm');
  const letterDisplay = document.getElementById('letterDisplay');
  const recipientInput = document.getElementById('recipient');
  const senderInput = document.getElementById('sender');
  const messageInput = document.getElementById('message');
  const writeNewBtn = document.getElementById('writeNewBtn');
  const copyCodeBtn = document.getElementById('copyCodeBtn');
  const historyBtn = document.getElementById('historyBtn');
  const openBtn = document.getElementById('openBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const messageList = document.getElementById('messageList');
  const backToWriteBtn = document.getElementById('backToWriteBtn');
  const backFromSettingsBtn = document.getElementById('backFromSettingsBtn');
  const saveTokenBtn = document.getElementById('saveTokenBtn');
  const clearTokenBtn = document.getElementById('clearTokenBtn');
  const githubTokenInput = document.getElementById('githubToken');
  const syncStatus = document.getElementById('syncStatus');
  const refreshBtn = document.getElementById('refreshBtn');

  let currentMessage = null;
  let currentCode = null;

  function generateCode() {
    return Math.random().toString(36).substring(2, 8).toUpperCase();
  }

  function showView(view) {
    writeView.classList.remove('active');
    readView.classList.remove('active');
    historyView.classList.remove('active');
    settingsView.classList.remove('active');
    view.classList.add('active');
    if (view === historyView) {
      loadPublicInbox();
    }
    if (view === settingsView) {
      githubTokenInput.value = localStorage.getItem(TOKEN_KEY) || '';
    }
  }

  function updateSyncStatus() {
    const token = localStorage.getItem(TOKEN_KEY);
    if (token) {
      syncStatus.textContent = 'Synced';
      syncStatus.className = 'sync-status on';
    } else {
      syncStatus.textContent = 'Local';
      syncStatus.className = 'sync-status off';
    }
  }

  function showToast(message) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => {
      toast.remove();
    }, 3000);
  }

  function encodeMessage(letter) {
    const data = btoa(unescape(encodeURIComponent(JSON.stringify(letter))));
    return data;
  }

  function decodeMessage(encoded) {
    try {
      const json = decodeURIComponent(escape(atob(encoded)));
      return JSON.parse(json);
    } catch (e) {
      return null;
    }
  }

  function getMessageFromHash() {
    const hash = window.location.hash;
    if (!hash || !hash.startsWith('#m=')) return null;
    const encoded = hash.replace('#m=', '');
    return decodeMessage(encoded);
  }

  function setMessageInHash(letter) {
    const encoded = encodeMessage(letter);
    window.location.hash = 'm=' + encoded;
  }

  function saveToHistory(letter, code) {
    let history = [];
    try {
      const stored = localStorage.getItem(HISTORY_KEY);
      if (stored) history = JSON.parse(stored);
    } catch (e) {}
    history.unshift({
      ...letter,
      code,
      id: Date.now(),
      createdAt: new Date().toISOString()
    });
    if (history.length > 50) history = history.slice(0, 50);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  }

  function getHistory() {
    try {
      const stored = localStorage.getItem(HISTORY_KEY);
      return stored ? JSON.parse(stored) : [];
    } catch (e) {
      return [];
    }
  }

  async function createGitHubIssue(letter) {
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) return false;

    const title = `Message to ${letter.recipient} from ${letter.sender}`;
    const body = `**To:** ${letter.recipient}\n**From:** ${letter.sender}\n**Date:** ${new Date(letter.createdAt).toLocaleString()}\n\n${letter.message}`;

    try {
      const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues`, {
        method: 'POST',
        headers: {
          'Authorization': `token ${token}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ title, body, labels: ['message'] })
      });

      if (response.ok) {
        showToast('Message published to public inbox!');
        return true;
      } else {
        const error = await response.json();
        showToast('Failed to publish: ' + (error.message || 'Unknown error'));
        return false;
      }
    } catch (error) {
      showToast('Network error. Message saved locally only.');
      return false;
    }
  }

  async function loadPublicInbox() {
    messageList.innerHTML = '<li style="cursor:default; justify-content:center; color:#8d6e63;">Loading messages...</li>';

    try {
      const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues?state=open&sort=created&direction=desc&per_page=30&labels=message`);
      
      if (!response.ok) {
        throw new Error('Failed to fetch messages');
      }

      const issues = await response.json();
      messageList.innerHTML = '';

      if (issues.length === 0) {
        messageList.innerHTML = '<li style="cursor:default; justify-content:center; color:#8d6e63;">No messages yet. Be the first to write one!</li>';
        return;
      }

      issues.forEach((issue) => {
        const li = document.createElement('li');
        const lines = issue.body.split('\n');
        let recipient = '', sender = '', message = '';
        lines.forEach(line => {
          if (line.startsWith('**To:**')) recipient = line.replace('**To:**', '').trim();
          if (line.startsWith('**From:**')) sender = line.replace('**From:**', '').trim();
        });
        const messageLines = lines.slice(lines.indexOf('') + 1);
        message = messageLines.join('\n').trim();

        const date = new Date(issue.created_at);
        const formattedDate = date.toLocaleDateString('en-US', {
          day: 'numeric',
          month: 'short',
          year: 'numeric'
        });

        li.innerHTML = `
          <div class="msg-to">To: ${escapeHtml(recipient)} <span style="font-weight:normal; color:#8d6e63;">from ${escapeHtml(sender)}</span></div>
          <div class="msg-preview">${escapeHtml(message.substring(0, 100))}${message.length > 100 ? '...' : ''}</div>
          <div class="msg-meta">${formattedDate} • #${issue.number}</div>
        `;
        li.addEventListener('click', () => {
          const fullMessage = {
            recipient,
            sender,
            message,
            createdAt: issue.created_at
          };
          currentMessage = fullMessage;
          currentCode = null;
          renderLetter(fullMessage);
          showView(readView);
        });
        messageList.appendChild(li);
      });
    } catch (error) {
      messageList.innerHTML = `<li style="cursor:default; justify-content:center; color:#8d6e63;">Failed to load messages. ${error.message}</li>`;
    }
  }

  function renderLetter(letter) {
    if (!letter) {
      letterDisplay.innerHTML = `
        <div class="placeholder">
          <div class="icon">✉️</div>
          <p>No message selected.</p>
        </div>
      `;
      copyCodeBtn.style.display = 'none';
      return;
    }

    const date = new Date(letter.createdAt);
    const formattedDate = date.toLocaleDateString('en-US', {
      day: 'numeric',
      month: 'long',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });

    letterDisplay.innerHTML = `
      <h2>Message for ${escapeHtml(letter.recipient)}</h2>
      <div class="divider"></div>
      <p class="meta">📅 ${formattedDate}</p>
      <div class="divider"></div>
      <div class="message">${escapeHtml(letter.message)}</div>
      <div class="divider"></div>
      <div class="signature">Yours sincerely,<br><strong>${escapeHtml(letter.sender)}</strong></div>
    `;
    copyCodeBtn.style.display = 'none';
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  letterForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const letter = {
      recipient: recipientInput.value.trim(),
      sender: senderInput.value.trim(),
      message: messageInput.value.trim(),
      createdAt: new Date().toISOString()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(letter));
    currentMessage = letter;
    saveToHistory(letter, null);
    setMessageInHash(letter);
    renderLetter(letter);
    
    const token = localStorage.getItem(TOKEN_KEY);
    if (token) {
      await createGitHubIssue(letter);
    } else {
      showToast('Message saved locally. Add a GitHub token in Settings to share publicly.');
    }
    
    showView(readView);
  });

  openBtn.addEventListener('click', () => {
    const code = prompt('Enter message code:');
    if (!code) return;
    const history = getHistory();
    const item = history.find(h => h.code && h.code.toLowerCase() === code.trim().toLowerCase());
    if (item) {
      currentMessage = item;
      currentCode = item.code;
      setMessageInHash(item);
      renderLetter(item);
      showView(readView);
    } else {
      showToast('Code not found. Please check and try again.');
    }
  });

  writeNewBtn.addEventListener('click', () => {
    currentMessage = null;
    currentCode = null;
    window.location.hash = '';
    recipientInput.value = '';
    senderInput.value = '';
    messageInput.value = '';
    showView(writeView);
  });

  historyBtn.addEventListener('click', () => {
    showView(historyView);
  });

  settingsBtn.addEventListener('click', () => {
    showView(settingsView);
  });

  backToWriteBtn.addEventListener('click', () => {
    showView(writeView);
  });

  backFromSettingsBtn.addEventListener('click', () => {
    updateSyncStatus();
    showView(writeView);
  });

  saveTokenBtn.addEventListener('click', () => {
    const token = githubTokenInput.value.trim();
    if (token) {
      localStorage.setItem(TOKEN_KEY, token);
      showToast('GitHub token saved! Messages will sync to public inbox.');
    } else {
      localStorage.removeItem(TOKEN_KEY);
      showToast('GitHub token removed.');
    }
    updateSyncStatus();
  });

  clearTokenBtn.addEventListener('click', () => {
    localStorage.removeItem(TOKEN_KEY);
    githubTokenInput.value = '';
    showToast('GitHub token cleared.');
    updateSyncStatus();
  });

  refreshBtn.addEventListener('click', () => {
    loadPublicInbox();
  });

  window.addEventListener('hashchange', () => {
    const letter = getMessageFromHash();
    if (letter) {
      currentMessage = letter;
      renderLetter(letter);
      showView(readView);
    }
  });

  window.addEventListener('load', () => {
    updateSyncStatus();
    const letter = getMessageFromHash();
    if (letter) {
      currentMessage = letter;
      renderLetter(letter);
      showView(readView);
    } else {
      showView(writeView);
    }
  });
</script>

</body>
</html>
