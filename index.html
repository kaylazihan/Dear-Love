<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surat Romantis</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #f5f0eb 0%, #e8dfd5 25%, #d7ccc8 50%, #e8dfd5 75%, #f5f0eb 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  .hearts-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }

  .heart {
    position: absolute;
    bottom: -50px;
    color: rgba(93, 64, 55, 0.5);
    font-size: 20px;
    animation: float-up linear infinite;
    user-select: none;
  }

  @keyframes float-up {
    0% {
      transform: translateY(0) rotate(0deg) scale(1);
      opacity: 1;
    }
    50% {
      transform: translateY(-50vh) rotate(180deg) scale(1.3);
      opacity: 0.7;
    }
    100% {
      transform: translateY(-110vh) rotate(360deg) scale(0.8);
      opacity: 0;
    }
  }

  .container {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    padding: 40px;
    max-width: 700px;
    width: 100%;
    position: relative;
    z-index: 1;
    backdrop-filter: blur(10px);
  }

  h1 {
    text-align: center;
    color: #4e342e;
    font-size: 2.5em;
    margin-bottom: 10px;
    text-shadow: 2px 2px 4px rgba(78, 52, 46, 0.2);
  }

  .subtitle {
    text-align: center;
    color: #5d4037;
    font-style: italic;
    margin-bottom: 30px;
    font-size: 1.1em;
  }

  .view {
    display: none;
    animation: fadeIn 0.6s ease-in;
  }

  .view.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  label {
    display: block;
    margin: 15px 0 8px 0;
    color: #4e342e;
    font-weight: bold;
    font-size: 1em;
  }

  input[type="text"],
  textarea {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #d7ccc8;
    border-radius: 10px;
    font-family: 'Georgia', serif;
    font-size: 1em;
    transition: border-color 0.3s ease;
    background: #fff;
    color: #333;
  }

  input[type="text"]:focus,
  textarea:focus {
    outline: none;
    border-color: #6d4c41;
    box-shadow: 0 0 10px rgba(109, 76, 65, 0.2);
  }

  textarea {
    resize: vertical;
    min-height: 200px;
    line-height: 1.6;
  }

  .buttons {
    display: flex;
    gap: 15px;
    margin-top: 25px;
    flex-wrap: wrap;
  }

  button {
    flex: 1;
    padding: 14px 25px;
    background: linear-gradient(135deg, #5d4037, #4e342e);
    color: white;
    border: none;
    border-radius: 25px;
    font-family: 'Georgia', serif;
    font-size: 1.1em;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(93, 64, 46, 0.3);
    min-width: 140px;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(93, 64, 46, 0.5);
    background: linear-gradient(135deg, #6d4c41, #5d4037);
  }

  button:active {
    transform: translateY(0);
  }

  button.secondary {
    background: linear-gradient(135deg, #8d6e63, #795548);
  }

  button.danger {
    background: linear-gradient(135deg, #4e342e, #3e2723);
  }

  .letter-display {
    background: #fff;
    border: 2px dashed #d7ccc8;
    border-radius: 15px;
    padding: 30px;
    margin: 20px 0;
    box-shadow: inset 0 0 20px rgba(141, 110, 99, 0.08);
  }

  .letter-display h2 {
    color: #4e342e;
    margin-bottom: 15px;
    font-size: 1.8em;
    text-align: center;
  }

  .letter-display .meta {
    text-align: center;
    color: #5d4037;
    font-style: italic;
    margin-bottom: 20px;
    font-size: 0.95em;
  }

  .letter-display .message {
    color: #333;
    line-height: 1.8;
    font-size: 1.05em;
    white-space: pre-wrap;
    text-align: justify;
  }

  .letter-display .signature {
    text-align: right;
    margin-top: 25px;
    color: #5d4037;
    font-style: italic;
    font-size: 1.1em;
  }

  .toast {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #4caf50;
    color: white;
    padding: 15px 25px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    z-index: 1000;
    animation: slideIn 0.4s ease-out, fadeOut 0.4s ease-in 2.6s;
    font-family: 'Georgia', serif;
  }

  @keyframes slideIn {
    from { transform: translateX(400px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  @keyframes fadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
  }

  .placeholder {
    text-align: center;
    color: #6d4c41;
    font-style: italic;
    padding: 40px 20px;
    font-size: 1.1em;
  }

  .placeholder .icon {
    font-size: 4em;
    margin-bottom: 15px;
  }

  .divider {
    height: 2px;
    background: linear-gradient(90deg, transparent, #d7ccc8, transparent);
    margin: 25px 0;
  }

  @media (max-width: 600px) {
    .container {
      padding: 25px 20px;
    }

    h1 {
      font-size: 2em;
    }

    button {
      min-width: 100%;
    }

    .buttons {
      flex-direction: column;
    }
  }
</style>
</head>
<body>

<div class="hearts-container" id="heartsContainer"></div>

<div class="container">
  <h1>💌 Surat Romantis</h1>
  <p class="subtitle">Tulis dan baca pesan penuh cinta</p>

  <div class="view active" id="writeView">
    <form id="letterForm">
      <label for="recipient">Kepada:</label>
      <input type="text" id="recipient" placeholder="Nama penerima..." required>

      <label for="sender">Dari:</label>
      <input type="text" id="sender" placeholder="Nama pengirim..." required>

      <label for="message">Pesan/Surat:</label>
      <textarea id="message" placeholder="Tuliskan surat atau pesan romantismu di sini..." required></textarea>

      <div class="buttons">
        <button type="submit">💝 Kirim & Simpan</button>
        <button type="button" class="secondary" id="viewLetterBtn">📖 Baca Surat</button>
      </div>
    </form>
  </div>

  <div class="view" id="readView">
    <div class="letter-display" id="letterDisplay">
      <div class="placeholder">
        <div class="icon">💌</div>
        <p>Belum ada surat yang ditulis.</p>
        <p style="margin-top: 10px;">Tulis surat pertamamu sekarang!</p>
      </div>
    </div>

    <div class="buttons">
      <button id="writeNewBtn">✏️ Tulis Surat Baru</button>
      <button class="danger" id="deleteLetterBtn">🗑️ Hapus Surat</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'romantic_letter';

  const writeView = document.getElementById('writeView');
  const readView = document.getElementById('readView');
  const letterForm = document.getElementById('letterForm');
  const letterDisplay = document.getElementById('letterDisplay');
  const recipientInput = document.getElementById('recipient');
  const senderInput = document.getElementById('sender');
  const messageInput = document.getElementById('message');
  const viewLetterBtn = document.getElementById('viewLetterBtn');
  const writeNewBtn = document.getElementById('writeNewBtn');
  const deleteLetterBtn = document.getElementById('deleteLetterBtn');
  const heartsContainer = document.getElementById('heartsContainer');

  function showView(view) {
    writeView.classList.remove('active');
    readView.classList.remove('active');
    view.classList.add('active');
  }

  function showToast(message) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => {
      toast.remove();
    }, 3000);
  }

  function saveLetter() {
    const letter = {
      recipient: recipientInput.value.trim(),
      sender: senderInput.value.trim(),
      message: messageInput.value.trim(),
      createdAt: new Date().toISOString()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(letter));
    return letter;
  }

  function loadLetter() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (!stored) return null;
    try {
      return JSON.parse(stored);
    } catch (e) {
      return null;
    }
  }

  function deleteLetter() {
    if (confirm('Apakah kamu yakin ingin menghapus surat ini?')) {
      localStorage.removeItem(STORAGE_KEY);
      letterDisplay.innerHTML = `
        <div class="placeholder">
          <div class="icon">💌</div>
          <p>Belum ada surat yang ditulis.</p>
          <p style="margin-top: 10px;">Tulis surat pertamamu sekarang!</p>
        </div>
      `;
      recipientInput.value = '';
      senderInput.value = '';
      messageInput.value = '';
      showToast('Surat telah dihapus');
    }
  }

  function renderLetter(letter) {
    if (!letter) {
      letterDisplay.innerHTML = `
        <div class="placeholder">
          <div class="icon">💌</div>
          <p>Belum ada surat yang ditulis.</p>
          <p style="margin-top: 10px;">Tulis surat pertamamu sekarang!</p>
        </div>
      `;
      return;
    }

    const date = new Date(letter.createdAt);
    const formattedDate = date.toLocaleDateString('id-ID', {
      day: 'numeric',
      month: 'long',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });

    letterDisplay.innerHTML = `
      <h2>💌 Surat untuk ${letter.recipient}</h2>
      <div class="divider"></div>
      <p class="meta">📅 ${formattedDate}</p>
      <div class="divider"></div>
      <div class="message">${escapeHtml(letter.message)}</div>
      <div class="divider"></div>
      <div class="signature">Dengan penuh cinta,<br><strong>${escapeHtml(letter.sender)}</strong></div>
    `;
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function createHeart() {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.textContent = '❤️';
    heart.style.left = Math.random() * 100 + '%';
    heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
    heart.style.animationDuration = (Math.random() * 5 + 6) + 's';
    heart.style.animationDelay = Math.random() * 2 + 's';
    heartsContainer.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 8000);
  }

  setInterval(createHeart, 800);

  letterForm.addEventListener('submit', (e) => {
    e.preventDefault();
    saveLetter();
    recipientInput.value = '';
    senderInput.value = '';
    messageInput.value = '';
    showToast('💝 Surat berhasil disimpan!');
  });

  viewLetterBtn.addEventListener('click', () => {
    const letter = loadLetter();
    renderLetter(letter);
    showView(readView);
  });

  writeNewBtn.addEventListener('click', () => {
    showView(writeView);
  });

  deleteLetterBtn.addEventListener('click', deleteLetter);
</script>

</body>
</html>
